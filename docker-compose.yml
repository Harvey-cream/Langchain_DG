# Lanchain_DG：MySQL(db) + Redis + FastAPI(backend) + Nginx
# 部署：cp .env.example .env 填密钥 → cp backend_langchain/env/settings_pro.example.yaml ...
#         backend_langchain/env/settings_pro.yaml → bash build_fronted.sh → docker compose up -d --build

services:
  db:
    image: mysql:8.0
    container_name: lanchain_mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-langchain}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      # 可改为宿主机目录，例如：/wwwroot/lanchain/mysql_data:/var/lib/mysql
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PUBLISH_PORT:-3307}:3306"
    networks:
      - shared_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 40s

  redis:
    image: redis:7.0-alpine
    container_name: lanchain_redis
    restart: always
    ports:
      - "127.0.0.1:${REDIS_PUBLISH_PORT:-6379}:6379"
    networks:
      - shared_network

  backend:
    container_name: lanchain_backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      # 以下由 .env 注入，供 settings_pro.yaml 中 ${OPENAI_API_KEY} 等插值
      # OPENAI_BASE_URL / OPENAI_API_KEY / OPENAI_MODEL
      # DASHSCOPE_API_KEY / APP_SECRET_KEY / APP_ALLOWED_HOST
      SKIP_RAG_STARTUP_WARMUP: ${SKIP_RAG_STARTUP_WARMUP:-}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - langgraph_data:/app/common/data
      - huggingface_cache:/root/.cache/huggingface
      - ./media:/app/media
      - ./backend_langchain/Langchain_knowledge/chroma:/app/Langchain_knowledge/chroma
      - ./backend_langchain/env/settings_pro.yaml:/app/env/settings_pro.yaml:ro
    expose:
      - "8000"
    networks:
      - shared_network
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  nginx:
    container_name: lanchain_nginx
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/conf/wx-sercret:/etc/nginx/wx-sercret:ro
      - ./frontend_langchain/dist:/usr/share/nginx/html:ro
      - ./static:/app/static:ro
      - ./media:/app/media:ro
    ports:
      - "80:80"
      # 有证书后再加 "443:443"，并在 nginx/nginx.conf 取消 HTTPS 段注释
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shared_network
    restart: always

networks:
  shared_network:
    driver: bridge

volumes:
  mysql_data:
  langgraph_data:
  huggingface_cache:
