# Lanchain_DG：PostgreSQL+pgvector(db) + Redis + FastAPI(backend) + Nginx
# 部署：cp .env.example .env 填密钥 → cp backend_langchain/env/settings_pro.example.yaml ...
#         backend_langchain/env/settings_pro.yaml → bash build_fronted.sh → docker compose up -d --build

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lanchain_postgres
    restart: always
    environment:
      # 业务库 + 向量库同库；checkpoint 独立库 langchain_checkpoint 由应用启动时 CREATE DATABASE
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-langchain}
    volumes:
      # 可改为宿主机目录，例如：/wwwroot/lanchain/postgres_data:/var/lib/postgresql/data
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-5433}:5432"
    networks:
      - shared_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-langchain} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 30s

  redis:
    image: redis:7.0-alpine
    container_name: lanchain_redis
    restart: always
    ports:
      - "127.0.0.1:${REDIS_PUBLISH_PORT:-6379}:6379"
    networks:
      - shared_network

  backend:
    container_name: lanchain_backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-langchain}
      # 与 settings_pro.yaml postgres.checkpoint_database 对应；库由 init_checkpointer 自动创建
      POSTGRES_CHECKPOINT_DATABASE: ${POSTGRES_CHECKPOINT_DATABASE:-langchain_checkpoint}
      # 以下由 .env 注入，供 settings_pro.yaml 中 ${OPENAI_API_KEY} 等插值
      # OPENAI_BASE_URL / OPENAI_API_KEY / OPENAI_MODEL
      # DASHSCOPE_API_KEY / APP_SECRET_KEY / APP_ALLOWED_HOST
      SKIP_RAG_STARTUP_WARMUP: ${SKIP_RAG_STARTUP_WARMUP:-}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - langgraph_data:/app/app/data/runtime
      - huggingface_cache:/root/.cache/huggingface
      - ./media:/app/media
      - ./backend_langchain/env/settings_pro.yaml:/app/env/settings_pro.yaml:ro
    expose:
      - "8000"
    networks:
      - shared_network
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  nginx:
    container_name: lanchain_nginx
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/conf/wx-sercret:/etc/nginx/wx-sercret:ro
      - ./frontend_langchain/dist:/usr/share/nginx/html:ro
      - ./static:/app/static:ro
      - ./media:/app/media:ro
    ports:
      - "80:80"
      # 有证书后再加 "443:443"，并在 nginx/nginx.conf 取消 HTTPS 段注释
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shared_network
    restart: always

networks:
  shared_network:
    driver: bridge

volumes:
  postgres_data:
  langgraph_data:
  huggingface_cache:
