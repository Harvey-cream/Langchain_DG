# 生产模板（进 git）：cp settings_pro.example.yaml settings_pro.yaml
# 密钥在根目录 .env 注入 OPENAI_API_KEY、DASHSCOPE_API_KEY 等

app:
  secret_key: "${APP_SECRET_KEY:-change-me-in-production}"
  debug: false
  allowed_hosts:
    - "${APP_ALLOWED_HOST:-your-server-ip-or-domain}"
    - localhost
    - "127.0.0.1"

mysql:
  host: db
  port: 3306
  database: "${MYSQL_DATABASE:-langchain}"
  user: root
  password: "${MYSQL_PASSWORD:-root}"

redis:
  host: redis
  port: 6379
  db: 0

llm:
  base_url: "${OPENAI_BASE_URL:-https://gpt-agent.cc/v1}"
  api_key: "${OPENAI_API_KEY:-}"
  model: "${OPENAI_MODEL:-gpt-5.4}"

dashscope:
  api_key: "${DASHSCOPE_API_KEY:-}"
  embedding_model: "${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v3}"
  embedding_dimensions: 1024
  embedding_base_url: "${DASHSCOPE_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
  embedding_batch_size: 10
  rerank_model: "${DASHSCOPE_RERANK_MODEL:-qwen3-rerank}"

rag:
  collection: knowledge
  recall_k: 40
  rerank_top_k: 5
  max_distance: 0.65
  query_rewrite_enabled: true
  query_rewrite_max_questions: 4
  query_rewrite_context_turns: 2
  docs_agent: docs1
  docs_interview: docs2
  chunk_size: 600
  chunk_overlap: 80
  hf_embedding_model: BAAI/bge-large-zh-v1.5
  hf_embedding_batch_size: 32
