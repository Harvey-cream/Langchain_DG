# 本地开发模板（进 git）：cp settings_debug.example.yaml settings_debug.yaml

app:
  secret_key: "${APP_SECRET_KEY:-django-insecure-local-dev-only}"
  debug: true
  allowed_hosts:
    - localhost
    - "127.0.0.1"
    - "[::1]"

postgres:
  host: "${POSTGRES_HOST:-localhost}"
  # Docker compose 默认映射 POSTGRES_PUBLISH_PORT=5433；本机原生 PG 可改 .env POSTGRES_PORT=5432
  port: "${POSTGRES_PORT:-5433}"
  database: "${POSTGRES_DATABASE:-langchain}"
  # LangGraph checkpoint 独立库（与业务库分库，同一实例）
  checkpoint_database: "${POSTGRES_CHECKPOINT_DATABASE:-langchain_checkpoint}"
  user: "${POSTGRES_USER:-postgres}"
  password: "${POSTGRES_PASSWORD:-postgres}"

redis:
  host: "${REDIS_HOST:-localhost}"
  port: 6379
  db: 0

llm:
  base_url: "${LLM_AGENT_BASE_URL:-https://api4.mygptlife.com/v1/}"
  api_key: "${LLM_AGENT_API_KEY:-}"
  model: "${LLM_AGENT_MODEL:-gemini-3.7-flash}"
  fallback_models: "${LLM_AGENT_FALLBACK_MODELS:-gpt-5.6-luna,claude-sonnet-4-6}"

dashscope:
  api_key: "${DASHSCOPE_API_KEY:-}"
  embedding_model: "${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v3}"
  embedding_dimensions: 1024
  embedding_base_url: "${DASHSCOPE_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
  embedding_batch_size: 10
  rerank_model: "${DASHSCOPE_RERANK_MODEL:-qwen3-rerank}"

rag:
  collection: knowledge
  user_collection: user_knowledge
  recall_k: 20
  rerank_top_k: 5
  query_rewrite_enabled: true
  query_rewrite_max_questions: 4
  query_rewrite_context_turns: 2
  docs_agent: docs1
  docs_interview: docs2
  chunk_size: 600
  chunk_overlap: 80
  hf_embedding_model: BAAI/bge-large-zh-v1.5
  hf_embedding_batch_size: 32

oss:
  access_key_id: "${OSS_ACCESS_KEY_ID:-}"
  access_key_secret: "${OSS_ACCESS_KEY_SECRET:-}"
  bucket_name: "${OSS_BUCKET_NAME:-my-oss-bucket-2026-2026}"
  endpoint: "${OSS_ENDPOINT:-oss-cn-shenzhen.aliyuncs.com}"
  prefix: "${OSS_PREFIX:-agent-kb}"
  url_prefix: "${OSS_URL_PREFIX:-}"
  max_file_bytes: 20971520
  upload_url_expires: 1800
